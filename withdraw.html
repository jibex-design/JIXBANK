<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JIXBANK | Withdraw</title>
  <link rel="icon" href="assets/images/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-body">
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="content">
        <h1 class="page-title">Withdraw</h1>

        <section class="card form-card">
          <span class="sim-tag">Simulated request: no real money moves</span>
          <p id="msg" class="form-message"></p>

          <form id="withdrawForm" novalidate>
            <div class="profile-field">
              <label for="bank">Bank</label>
              <select id="bank">
                <option value="">Select a bank</option>
                <option>Access Bank</option>
                <option>GTBank</option>
                <option>First Bank</option>
                <option>UBA</option>
                <option>Zenith Bank</option>
                <option>Opay</option>
                <option>Kuda</option>
                <option>Moniepoint</option>
              </select>
            </div>
            <div class="profile-field">
              <label for="acctNo">Account number</label>
              <input type="text" id="acctNo" inputmode="numeric" maxlength="10" placeholder="10-digit account number" autocomplete="off" />
            </div>
            <div class="profile-field">
              <label for="acctName">Account name</label>
              <input type="text" id="acctName" maxlength="60" placeholder="Name on the account" autocomplete="off" />
            </div>
            <div class="profile-field">
              <label for="amount">Amount (₦)</label>
              <input type="number" id="amount" min="500" step="0.01" placeholder="0.00" />
              <small id="balanceHint"></small>
            </div>
            <button type="submit" class="btn-primary" id="submitBtn">Request withdrawal</button>
          </form>
          <small style="display:block;margin-top:12px;color:var(--muted)">
            Demo requests stay <strong>Pending</strong>, because no real bank is connected.
          </small>
        </section>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
  <script src="js/ui.js"></script>
  <script type="module" src="js/guard.js"></script>
  <script type="module" src="js/withdraw.js"></script>
</body>
</html>
